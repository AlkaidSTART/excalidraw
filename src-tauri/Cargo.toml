[package]
name = "excalidraw"
version = "0.1.0"
description = "Excalidraw desktop and mobile app"
authors = ["Excalidraw"]
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "excalidraw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
