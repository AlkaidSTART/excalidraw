name: Build & Release

on:
  push:
    branches: master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional exact version (e.g. 1.4.0). Leave empty to auto-bump the patch."
        required: false
        type: string

concurrency:
  group: build-${{ github.ref }}
  # Auto-releases must not be cancelled halfway through a version bump.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:app

  version:
    name: Resolve version
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # tags are needed to compute the next patch version
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Resolve version
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            VERSION="${INPUT_VERSION#v}"
          else
            BASE="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | head -n1 | sed 's/^v//')"
            if [[ -z "$BASE" ]]; then
              BASE="$(node -p "require('./package.json').version")"
            fi
            VERSION="$(node scripts/bump-version.js patch --base "$BASE" --dry-run)"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

  macos-dmg:
    name: macOS DMG
    needs: [test, version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - name: Apply release version
        run: node scripts/bump-version.js --set "${{ needs.version.outputs.version }}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build DMG
        run: pnpm tauri build --bundles dmg
        env:
          # ad-hoc signature, no Apple Developer certificate required
          APPLE_SIGNING_IDENTITY: "-"

      - uses: actions/upload-artifact@v4
        with:
          name: excalidraw-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  android-apk:
    name: Android APK
    needs: [test, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - name: Apply release version
        run: node scripts/bump-version.js --set "${{ needs.version.outputs.version }}"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # the default `tools` package was removed from Google's SDK repository
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Android signing
        working-directory: src-tauri/gen/android
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEY_BASE64" ]; then
            echo "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            key_alias="${ANDROID_KEY_ALIAS:-upload}"
            key_password="$ANDROID_KEY_PASSWORD"
          else
            echo "::warning::ANDROID_KEY_BASE64 is not set, signing with a throwaway key. Installing an update will require uninstalling the previous APK."
            keytool -genkeypair \
              -keystore "$RUNNER_TEMP/keystore.jks" \
              -storepass excalidraw \
              -keypass excalidraw \
              -alias excalidraw \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Excalidraw"
            key_alias=excalidraw
            key_password=excalidraw
          fi

          cat > keystore.properties <<EOF
          keyAlias=$key_alias
          password=$key_password
          storeFile=$RUNNER_TEMP/keystore.jks
          EOF

      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Pre-download Gradle distribution
        working-directory: src-tauri/gen/android
        run: |
          for attempt in 1 2 3 4 5; do
            if ./gradlew --version; then
              exit 0
            fi
            echo "::warning::Gradle distribution download failed (attempt $attempt), retrying..."
            sleep 10
          done
          echo "::error::Unable to download the Gradle distribution after 5 attempts"
          exit 1

      - name: Build APK
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          for attempt in 1 2 3; do
            if pnpm tauri android build --apk --target aarch64 armv7; then
              exit 0
            fi
            echo "::warning::APK build failed (attempt $attempt), retrying..."
            sleep 15
          done
          echo "::error::APK build failed after 3 attempts"
          exit 1

      - name: Save Gradle cache
        if: always() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        with:
          name: excalidraw-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  release:
    name: Release
    needs: [version, macos-dmg, android-apk]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        if: github.ref == 'refs/heads/master'
        with:
          fetch-depth: 0

      - name: Commit version bump and tag
        if: github.ref == 'refs/heads/master'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail

          node scripts/bump-version.js --set "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore(release): ${TAG} [skip ci]"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git tag "${TAG}"
          git push origin "${TAG}"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: |
            dist/**/*.dmg
            dist/**/*.apk
          generate_release_notes: true
